<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>eShop — email settings</title>
  <style>
    body { font-family: Segoe UI, sans-serif; max-width: 32rem; margin: 2rem auto; }
    label { display: flex; gap: 0.5rem; align-items: center; margin: 1rem 0; }
    pre { background: #f4f4f4; padding: 0.75rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>Email notifications</h1>
  <p>Signed in as <strong>C-1001</strong> (email opted in). This page only toggles <em>email</em>.</p>
  <p><a href="/warehouse">Warehouse</a></p>
  <label>
    <input type="checkbox" id="emailEnabled" />
    Email me when my order ships
  </label>
  <button type="button" id="save">Save</button>
  <pre id="out"></pre>
  <script>
    const id = "C-1001";
    const out = document.getElementById("out");
    const box = document.getElementById("emailEnabled");
    async function load() {
      const r = await fetch("/api/customers/" + id + "/preferences");
      const data = await r.json();
      box.checked = data.email_enabled === true;
      out.textContent = JSON.stringify(data, null, 2);
    }
    document.getElementById("save").onclick = async () => {
      const r = await fetch("/api/customers/" + id + "/preferences", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email_enabled: box.checked })
      });
      out.textContent = JSON.stringify(await r.json(), null, 2);
    };
    load();
  </script>
</body>
</html>
